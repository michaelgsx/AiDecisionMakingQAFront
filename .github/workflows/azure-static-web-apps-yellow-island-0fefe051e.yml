# Azure Static Web Apps: ai-rag-agentic-qa
# Hostname: yellow-island-0fefe051e.7.azurestaticapps.net
#
# This filename is registered with Azure when the SWA was linked to GitHub — do not rename.
# GitHub-linked SWAs require BOTH deployment token + github_id_token (OIDC).
#
# Secrets:
#   AZURE_CREDENTIALS           SP JSON for Key Vault read
#   AZURE_KEYVAULT_NAME         Optional; vault name only: ai-rag-key
#   VITE_AGENT_API_BASE_URL
#   VITE_OPS_TOKEN              (optional)

name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - v1
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - v1

env:
  AZURE_KEYVAULT_NAME: ai-rag-key
  KEYVAULT_SECRET_NAME: ai-rag-agentic-qa

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install and build
        run: npm ci && npm run build
        env:
          VITE_AGENT_API_BASE_URL: ${{ secrets.VITE_AGENT_API_BASE_URL }}
          VITE_OPS_TOKEN: ${{ secrets.VITE_OPS_TOKEN }}
          VITE_USE_MOCK: ${{ secrets.VITE_USE_MOCK }}

      - name: Azure CLI login
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          set -euo pipefail
          command -v jq >/dev/null
          TID=$(jq -r .tenantId <<<"$AZURE_CREDENTIALS")
          CID=$(jq -r .clientId <<<"$AZURE_CREDENTIALS")
          SEC=$(jq -r .clientSecret <<<"$AZURE_CREDENTIALS")
          if [ -z "$TID" ] || [ "$TID" = "null" ] || [ -z "$CID" ] || [ "$CID" = "null" ] || [ -z "$SEC" ] || [ "$SEC" = "null" ]; then
            echo "AZURE_CREDENTIALS must be JSON with tenantId, clientId, clientSecret." >&2
            exit 1
          fi
          az login --service-principal -u "$CID" -p "$SEC" --tenant "$TID" --allow-no-subscriptions

      - name: Fetch SWA deployment token from Key Vault (ai-rag-agentic-qa)
        run: |
          set -euo pipefail
          VAULT='${{ vars.AZURE_KEYVAULT_NAME }}'
          if [ -z "$VAULT" ]; then VAULT='${{ secrets.AZURE_KEYVAULT_NAME }}'; fi
          if [ -z "$VAULT" ]; then VAULT='${{ env.AZURE_KEYVAULT_NAME }}'; fi
          case "$VAULT" in
            '{'*)
              echo "AZURE_KEYVAULT_NAME must be vault name only (ai-rag-key), not SP JSON." >&2
              exit 1
              ;;
          esac
          TOKEN=$(az keyvault secret show \
            --vault-name "$VAULT" \
            --name '${{ env.KEYVAULT_SECRET_NAME }}' \
            --query value -o tsv | tr -d '\n\r')
          if [ -z "$TOKEN" ]; then
            echo "Empty secret ${{ env.KEYVAULT_SECRET_NAME }} in vault $VAULT" >&2
            exit 1
          fi
          echo "Fetched deployment token for SWA ai-rag-agentic-qa (length ${#TOKEN})"
          echo "::add-mask::$TOKEN"
          echo "SWA_DEPLOYMENT_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Get GitHub OIDC token
        uses: actions/github-script@v7
        id: idtoken
        with:
          script: |
            const core = require('@actions/core')
            return await core.getIDToken('api://AzureADTokenExchange')

      - name: Deploy to Static Web App ai-rag-agentic-qa
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_DEPLOYMENT_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          api_location: ""
          output_location: ""
          skip_app_build: true
          production_branch: v1
          github_id_token: ${{ steps.idtoken.outputs.result }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Azure CLI login
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          set -euo pipefail
          TID=$(jq -r .tenantId <<<"${{ secrets.AZURE_CREDENTIALS }}")
          CID=$(jq -r .clientId <<<"${{ secrets.AZURE_CREDENTIALS }}")
          SEC=$(jq -r .clientSecret <<<"${{ secrets.AZURE_CREDENTIALS }}")
          az login --service-principal -u "$CID" -p "$SEC" --tenant "$TID" --allow-no-subscriptions

      - name: Fetch SWA deployment token from Key Vault
        run: |
          set -euo pipefail
          VAULT='${{ vars.AZURE_KEYVAULT_NAME }}'
          if [ -z "$VAULT" ]; then VAULT='${{ secrets.AZURE_KEYVAULT_NAME }}'; fi
          if [ -z "$VAULT" ]; then VAULT='${{ env.AZURE_KEYVAULT_NAME }}'; fi
          TOKEN=$(az keyvault secret show \
            --vault-name "$VAULT" \
            --name '${{ env.KEYVAULT_SECRET_NAME }}' \
            --query value -o tsv | tr -d '\n\r')
          echo "::add-mask::$TOKEN"
          echo "SWA_DEPLOYMENT_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_DEPLOYMENT_TOKEN }}
          action: close
