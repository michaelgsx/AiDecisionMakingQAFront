# Deploy Vite SPA to Azure Static Web Apps resource: ai-rag-agentic-qa
# Deployment token is read from Azure Key Vault at runtime (same pattern as AiDecisionMakingFrontend).
#
# --- GitHub → Settings → Secrets and variables → Actions ---
#
# Secrets (required):
#   AZURE_CREDENTIALS
#     JSON: clientId, clientSecret, tenantId (subscriptionId optional — ignored by login step).
#     Login uses Azure CLI with --allow-no-subscriptions so Key Vault works even if the SP
#     has no subscription RBAC (subscriptionId in JSON no longer breaks login).
#     Grant the same app "Key Vault Secrets User" on the vault (IAM on the Key Vault resource).
#
# Repository variable OR secret (same name; use Variables tab OR Secrets tab):
#   AZURE_KEYVAULT_NAME
#     Vault name only (not URI), e.g. ai-rag-key
#     If Variables/Secrets are empty (e.g. fork PR), workflow falls back to default vault name
#     ai-rag-key or workflow_dispatch input keyvault_name.
#
# Optional repository variable OR secret:
#   KEYVAULT_SECRET_NAME
#     Defaults to ai-rag-agentic-qa if unset.
#
# Optional secrets (Vite build-time):
#   VITE_AGENT_API_BASE_URL   (no trailing slash)
#   VITE_OPS_TOKEN
#   VITE_USE_MOCK               (e.g. true for mock-only UI build)

name: Deploy QA frontend (ai-rag-agentic-qa)

on:
  workflow_dispatch:
    inputs:
      keyvault_name:
        description: "Azure Key Vault name (used if repo Variable/Secret AZURE_KEYVAULT_NAME is empty)"
        required: false
        type: string
        default: ai-rag-key
  push:
    branches: [v1]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [v1]

env:
  VITE_AGENT_API_BASE_URL_DEFAULT: https://ai-rag-agentic-ai-h4c6ccfddad5dnd2.westus2-01.azurewebsites.net

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Resolve Vite build configuration
        id: vite
        run: |
          set -euo pipefail
          AGENT_URL='${{ vars.VITE_AGENT_API_BASE_URL }}'
          if [ -z "$AGENT_URL" ]; then AGENT_URL='${{ secrets.VITE_AGENT_API_BASE_URL }}'; fi
          if [ -z "$AGENT_URL" ]; then
            AGENT_URL='${{ env.VITE_AGENT_API_BASE_URL_DEFAULT }}'
            echo "::notice::VITE_AGENT_API_BASE_URL not set in repo Variables/Secrets; using production default." >&2
          fi
          AGENT_URL="${AGENT_URL%/}"
          echo "agent_api_base_url=$AGENT_URL" >> "$GITHUB_OUTPUT"
          MOCK='${{ vars.VITE_USE_MOCK }}'
          if [ -z "$MOCK" ]; then MOCK='${{ secrets.VITE_USE_MOCK }}'; fi
          if [ -z "$MOCK" ]; then MOCK='false'; fi
          echo "use_mock=$MOCK" >> "$GITHUB_OUTPUT"
          echo "Building against agent API: $AGENT_URL (mock=$MOCK)"

      - name: Install and build
        run: npm ci && npm run build
        env:
          VITE_AGENT_API_BASE_URL: ${{ steps.vite.outputs.agent_api_base_url }}
          VITE_OPS_TOKEN: ${{ secrets.VITE_OPS_TOKEN }}
          VITE_USE_MOCK: ${{ steps.vite.outputs.use_mock }}

      - name: Azure CLI login (service principal, Key Vault–friendly)
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          set -euo pipefail
          command -v jq >/dev/null
          TID=$(jq -r .tenantId <<<"$AZURE_CREDENTIALS")
          CID=$(jq -r .clientId <<<"$AZURE_CREDENTIALS")
          SEC=$(jq -r .clientSecret <<<"$AZURE_CREDENTIALS")
          if [ -z "$TID" ] || [ "$TID" = "null" ] || [ -z "$CID" ] || [ "$CID" = "null" ] || [ -z "$SEC" ] || [ "$SEC" = "null" ]; then
            echo "AZURE_CREDENTIALS must be JSON with tenantId, clientId, clientSecret." >&2
            exit 1
          fi
          az login --service-principal -u "$CID" -p "$SEC" --tenant "$TID" --allow-no-subscriptions

      - name: Fetch Static Web Apps deployment token from Key Vault
        run: |
          set -euo pipefail
          VAULT='${{ vars.AZURE_KEYVAULT_NAME }}'
          if [ -z "$VAULT" ]; then VAULT='${{ secrets.AZURE_KEYVAULT_NAME }}'; fi
          if [ -z "$VAULT" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VAULT='${{ github.event.inputs.keyvault_name }}'
          fi
          if [ -z "$VAULT" ]; then
            VAULT="ai-rag-key"
            echo "::warning::AZURE_KEYVAULT_NAME not set in repo Variables/Secrets; using default vault name ai-rag-key. Add Variable AZURE_KEYVAULT_NAME to avoid this." >&2
          fi
          SECRET_NAME='${{ vars.KEYVAULT_SECRET_NAME }}'
          if [ -z "$SECRET_NAME" ]; then SECRET_NAME='${{ secrets.KEYVAULT_SECRET_NAME }}'; fi
          if [ -z "$SECRET_NAME" ]; then SECRET_NAME="ai-rag-agentic-qa"; fi
          TOKEN=$(az keyvault secret show \
            --vault-name "$VAULT" \
            --name "$SECRET_NAME" \
            --query value -o tsv)
          if [ -z "$TOKEN" ]; then
            echo "Key Vault returned an empty secret." >&2
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "SWA_DEPLOYMENT_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      # skip_app_build: true — per MS docs, app_location must be the folder to deploy
      # and output_location must be empty (not repo root + "dist").
      # https://learn.microsoft.com/en-us/azure/static-web-apps/build-configuration
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_DEPLOYMENT_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          api_location: ""
          output_location: ""
          skip_app_build: true

  close_pr_environment:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Azure CLI login (service principal, Key Vault–friendly)
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          set -euo pipefail
          command -v jq >/dev/null
          TID=$(jq -r .tenantId <<<"$AZURE_CREDENTIALS")
          CID=$(jq -r .clientId <<<"$AZURE_CREDENTIALS")
          SEC=$(jq -r .clientSecret <<<"$AZURE_CREDENTIALS")
          if [ -z "$TID" ] || [ "$TID" = "null" ] || [ -z "$CID" ] || [ "$CID" = "null" ] || [ -z "$SEC" ] || [ "$SEC" = "null" ]; then
            echo "AZURE_CREDENTIALS must be JSON with tenantId, clientId, clientSecret." >&2
            exit 1
          fi
          az login --service-principal -u "$CID" -p "$SEC" --tenant "$TID" --allow-no-subscriptions

      - name: Fetch Static Web Apps deployment token from Key Vault
        run: |
          set -euo pipefail
          VAULT='${{ vars.AZURE_KEYVAULT_NAME }}'
          if [ -z "$VAULT" ]; then VAULT='${{ secrets.AZURE_KEYVAULT_NAME }}'; fi
          if [ -z "$VAULT" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VAULT='${{ github.event.inputs.keyvault_name }}'
          fi
          if [ -z "$VAULT" ]; then
            VAULT="ai-rag-key"
            echo "::warning::AZURE_KEYVAULT_NAME not set; using default ai-rag-key for PR close job." >&2
          fi
          SECRET_NAME='${{ vars.KEYVAULT_SECRET_NAME }}'
          if [ -z "$SECRET_NAME" ]; then SECRET_NAME='${{ secrets.KEYVAULT_SECRET_NAME }}'; fi
          if [ -z "$SECRET_NAME" ]; then SECRET_NAME="ai-rag-agentic-qa"; fi
          TOKEN=$(az keyvault secret show \
            --vault-name "$VAULT" \
            --name "$SECRET_NAME" \
            --query value -o tsv)
          echo "::add-mask::$TOKEN"
          echo "SWA_DEPLOYMENT_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Close Static Web Apps PR environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_DEPLOYMENT_TOKEN }}
          action: close
